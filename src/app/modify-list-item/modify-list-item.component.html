
<form [formGroup]="carForm" (ngSubmit)="onSubmit()">

  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>


  <div class="form-group">
    <label for="Name">Name</label>
    <input type="text" id="Name" formControlName="Name" />
  </div>


  <div class="form-group">
    <label for="Model">Model</label>
    <input type="text" id="Model" formControlName="Model" />
  </div>


  <div class="form-group">
    <label for="Year">Year</label>
    <input type="number" id="Year" formControlName="Year" />
  </div>

  <div class="form-group">
    <label for="Make">Make</label>
    <input type="text" id="Make" formControlName="Make" />
  </div>


  <div class="form-group">
    <label for="Color">Color</label>
    <input type="text" id="Color" formControlName="Color" />
  </div>

  <div class="form-group">
    <label for="Price">Price</label>
    <input type="number" id="Price" formControlName="Price" />
  </div>

  <div class="form-group">
    <label for="isAdmin">Is Admin</label>
    <input type="checkbox" id="isAdmin" formControlName="isAdmin" />
  </div>

  <!-- Submit Button (Add or Update) -->
  <button type="submit">Submit</button>

  <!-- Delete Button (Always Displayed Now) -->
  <button type="button" (click)="onDelete()">Delete</button>

  <!-- Back Button -->
  <button type="button" (click)="navigateToCarList()">Back to List</button>
</form>
